spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tfg}
    username: ${SPRING_DATASOURCE_USERNAME:tfg}
    password: ${SPRING_DATASOURCE_PASSWORD:tfg}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

riot:
  api:
    key: ${RIOT_API_KEY:}
    connect-timeout: 3s
    read-timeout: 3s

server:
  port: ${PORT:8080}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  scheduler:
    professionals:
      initial-delay-ms: ${APP_PROFESSIONALS_INITIAL_DELAY_MS:180000}
      fixed-delay-ms: ${APP_PROFESSIONALS_FIXED_DELAY_MS:1200000}

    champion-stats:
      initial-delay-ms: ${APP_CHAMPION_STATS_INITIAL_DELAY_MS:60000}
      fixed-delay-ms: ${APP_CHAMPION_STATS_FIXED_DELAY_MS:21600000}
